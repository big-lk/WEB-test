<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-label="個人ならではの判断を引き出す：AI共創インターフェースの手順" xml:lang="ja" style="font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f64c8"/></marker></defs><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><rect width="1600" height="950" fill="#fff"/><text x="64" y="74" font-size="34" fill="#1b1d21" font-weight="700" text-anchor="start">個人ならではの判断を引き出す：AI共創インターフェースの手順</text><text x="64" y="112" font-size="18" fill="#5f6670" font-weight="400" text-anchor="start">例：最近疲れている相手のために夕食を考える（6ターンの対話）</text><circle cx="82" cy="166" r="18" fill="#b57900"/><text x="82" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="112" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">考えを伝える</text><text x="64" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">自分の言葉で伝える。</text><text x="64" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">言い表しにくい言葉が入りやすい。</text><rect x="64" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="414" y1="432.0" x2="436" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="458" cy="166" r="18" fill="#b57900"/><text x="458" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="488" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">AIの読み取りを見る</text><text x="440" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">右側パネルが文を価値項目に分け、</text><text x="440" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">推測と優先順位を示す。</text><rect x="440" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="790" y1="432.0" x2="812" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="834" cy="166" r="18" fill="#b57900"/><text x="834" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="864" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">ずれに気づく</text><text x="816" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">自分の考えと照らし合わせ、</text><text x="816" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">AIの読み違いを見つける。</text><rect x="816" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="1166" y1="432.0" x2="1188" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="1210" cy="166" r="18" fill="#b57900"/><text x="1210" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1240" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">修正する</text><text x="1192" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">一文を補うか、項目ごとに</text><text x="1192" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">誰が判断するかを変える。</text><rect x="1192" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><rect x="84" y="284" width="44" height="24" rx="12" fill="#eaf0fb"/><text x="106" y="301" font-size="13" fill="#2f64c8" font-weight="700" text-anchor="middle">あなた</text><rect x="84" y="320" width="304" height="108" rx="14" fill="#fff" stroke="#c9d6f0" stroke-width="1.5" /><text x="102" y="354" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">相手は最近疲れていて食欲も</text><text x="102" y="380" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">ない。少し特別で、相手が</text><text x="102" y="406" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">気を遣わなくていい夕食にしたい。</text><rect x="84" y="532" width="304" height="48" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="100" y="562" font-size="15" fill="#8a9099" font-weight="400" text-anchor="start">考えを入力…</text><rect x="326" y="538" width="54" height="36" rx="8" fill="#2f64c8"/><path d="M353 564V548M347 554l6-6 6 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="296" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">AIの読み取り</text><rect x="458" y="312" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="312" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="342" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">品数を減らす</text><rect x="684" y="325" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="342" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">優先 1</text><text x="476" y="372" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI推測：準備も配膳も手軽に</text><rect x="458" y="406" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="406" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="436" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">少し特別</text><rect x="684" y="419" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="436" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">優先 2</text><text x="476" y="466" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI推測：盛り付けに記念感を</text><rect x="458" y="500" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="500" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="530" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">あっさり温かく</text><rect x="684" y="513" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="530" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">優先 3</text><text x="476" y="560" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI推測：胃にやさしく</text><rect x="834" y="284" width="308" height="126" rx="10" fill="#fff" stroke="#d9622b" stroke-width="1.6" /><rect x="848" y="296" width="99" height="24" rx="12" fill="#fdf0e9"/><text x="860" y="313" font-size="13.5" fill="#d9622b" font-weight="700" text-anchor="start">意味の限定</text><text x="850" y="346" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">「特別」が「記念感のある盛り付け」</text><text x="850" y="370" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">と解釈された。私の意図は</text><text x="850" y="394" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">「相手の好きな家庭料理」。</text><rect x="834" y="426" width="308" height="102" rx="10" fill="#fff" stroke="#d9622b" stroke-width="1.6" /><rect x="848" y="438" width="144" height="24" rx="12" fill="#fdf0e9"/><text x="860" y="455" font-size="13.5" fill="#d9622b" font-weight="700" text-anchor="start">優先順位の先取り</text><text x="850" y="488" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">AIは「品数を減らす」を優先。</text><text x="850" y="512" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">私は「相手の口に合う」を重視。</text><text x="1210" y="298" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">入力文を直す</text><rect x="1210" y="310" width="308" height="84" rx="10" fill="#fff" stroke="#c9d6f0" stroke-width="1.5" /><text x="1226" y="342" font-size="14.5" fill="#1b1d21" font-weight="400" text-anchor="start">「特別」は相手の好きな家庭の味。</text><text x="1226" y="366" font-size="14.5" fill="#1b1d21" font-weight="400" text-anchor="start">品数は少なくても口に合うこと。</text><text x="1210" y="418" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">判断分担を変える</text><rect x="1210" y="430" width="308" height="130" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="1210" y="430" width="5" height="130" rx="2.5" fill="#2f64c8"/><text x="1228" y="462" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">少し特別</text><rect x="1226" y="484" width="276" height="44" rx="10" fill="#eef0f3" stroke="#eef0f3" stroke-width="1.5" /><rect x="1230" y="488" width="84.0" height="36" rx="8" fill="#2f64c8"/><text x="1272.0" y="511" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">自分で判断</text><text x="1364.0" y="511" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">AIと相談</text><text x="1456.0" y="511" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">AIに任せる</text><path d="M1364.0 610V660H612.0V618" fill="none" stroke="#2f64c8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ahb)"/><rect x="738.5" y="642" width="499" height="36" rx="18" fill="#fff" stroke="#2f64c8" stroke-width="1.5"/><text x="988.0" y="666" font-size="16" fill="#2f64c8" font-weight="700" text-anchor="middle">AIが修正に合わせて回答とパネルを更新し、次のターンへ</text><rect x="64.0" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="86.0" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">価値項目</text><text x="86.0" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">利用者が大事にしている一つのこと（例：「口に合う」）。</text><text x="86.0" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">AIが文を分け、推測した意味と優先順位を示す。</text><rect x="565.3333333333333" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="587.3333333333333" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">二つのずれ</text><text x="587.3333333333333" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">意味の限定：曖昧な言葉を一般的な一つの意味に絞ること。</text><text x="587.3333333333333" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">優先順位の先取り：確認せずに順番を決めること。</text><rect x="1066.6666666666665" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="1088.6666666666665" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">判断分担</text><text x="1088.6666666666665" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">項目ごとに「自分で判断」「AIと相談」「AIに任せる」を選ぶ。</text><text x="1088.6666666666665" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">いつでも変更でき、AIは選択に合わせて応答を変える。</text><text x="64" y="920" font-size="14.5" fill="#8a9099" font-weight="400" text-anchor="start">例の対話は説明用の想定場面で、実験データではない。構成は修士研究の視線計測実験用テスト画面に基づく。</text></svg>