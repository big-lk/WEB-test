<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Three stages: find the problem, compare interfaces, then watch real conversations" xml:lang="en" style="font-family:'Inter','Helvetica Neue',Arial,'Noto Sans',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><rect width="1600" height="600" fill="#fff"/><text x="64" y="74" font-size="27" fill="#1b1d21" font-weight="700" text-anchor="start">Three stages: find the problem, compare interfaces, then watch real conversations</text><rect x="64.0" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="88.0" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">01</text><rect x="438.66666666666674" y="146" width="60.0" height="28" rx="14" fill="#e7f5ee"/><text x="468.66666666666674" y="165" font-size="14" fill="#1f8a5b" font-weight="700" text-anchor="middle">Done</text><text x="88.0" y="212" font-size="21" fill="#1b1d21" font-weight="700" text-anchor="start">Scenario comparison</text><text x="88.0" y="256" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">47 people read four AI conversations about</text><text x="88.0" y="283" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">the same dinner plan and rated five items,</text><text x="88.0" y="310" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">such as “I can take part” and “I’d continue”.</text><line x1="88.0" y1="342" x2="498.66666666666674" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="88.0" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">Finding</text><text x="88.0" y="414" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">Feeling involved did not mean wanting</text><text x="88.0" y="442" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">to continue; ratings differed sharply</text><text x="88.0" y="470" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">by what people valued (p=.0078).</text><line x1="530.6666666666667" y1="320" x2="562.6666666666667" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="570.6666666666667" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="594.6666666666667" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">02</text><rect x="885.8333333333335" y="146" width="119.5" height="28" rx="14" fill="#eaf0fb"/><text x="945.5833333333335" y="165" font-size="14" fill="#2f64c8" font-weight="700" text-anchor="middle">In progress</text><text x="594.6666666666667" y="212" font-size="21" fill="#1b1d21" font-weight="700" text-anchor="start">Interface scenario study</text><text x="594.6666666666667" y="256" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">30–40 students compare three screens:</text><text x="594.6666666666667" y="283" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">history only / AI reading shown / reading</text><text x="594.6666666666667" y="310" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">editable + who decides + example text.</text><line x1="594.6666666666667" y1="342" x2="1005.3333333333335" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="594.6666666666667" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">What it looks at</text><text x="594.6666666666667" y="414" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">Which screen makes the gap easier</text><text x="594.6666666666667" y="442" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">to notice and to fix.</text><line x1="1037.3333333333335" y1="320" x2="1069.3333333333335" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1077.3333333333335" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="1101.3333333333335" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">03</text><rect x="1426.5000000000002" y="146" width="85.5" height="28" rx="14" fill="#f0f1f3"/><text x="1469.2500000000002" y="165" font-size="14" fill="#8a9099" font-weight="700" text-anchor="middle">Planned</text><text x="1101.3333333333335" y="212" font-size="21" fill="#1b1d21" font-weight="700" text-anchor="start">Live conversation + eye tracking</text><text x="1101.3333333333335" y="256" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">Six real turns, comparing “view the reading”</text><text x="1101.3333333333335" y="283" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">with “change who decides”; recording gaze,</text><text x="1101.3333333333335" y="310" font-size="15" fill="#5f6670" font-weight="400" text-anchor="start">think-aloud, and edits.</text><line x1="1101.3333333333335" y1="342" x2="1512.0000000000002" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="1101.3333333333335" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">What it looks at</text><text x="1101.3333333333335" y="414" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">Whether people look back at the panel</text><text x="1101.3333333333335" y="442" font-size="16" fill="#1b1d21" font-weight="500" text-anchor="start">after noticing a gap, then edit.</text><text x="64" y="566" font-size="13.5" fill="#8a9099" font-weight="400" text-anchor="start">In stage 1 the group that valued the dining atmosphere had only 6 people; stage 2 rates impressions of screen scenarios, not real use.</text></svg>