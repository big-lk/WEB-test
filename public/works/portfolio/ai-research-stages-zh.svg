<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="研究分三步：先找问题，再比界面，最后看真实对话" xml:lang="zh" style="font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><rect width="1600" height="600" fill="#fff"/><text x="64" y="74" font-size="30" fill="#1b1d21" font-weight="700" text-anchor="start">研究分三步：先找问题，再比界面，最后看真实对话</text><rect x="64.0" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="88.0" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">01</text><rect x="427.66666666666674" y="146" width="71" height="28" rx="14" fill="#e7f5ee"/><text x="463.16666666666674" y="165" font-size="14" fill="#1f8a5b" font-weight="700" text-anchor="middle">已完成</text><text x="88.0" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">场景比较调查</text><text x="88.0" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">47 人阅读同一个晚餐构想的 4 种 AI 对话，</text><text x="88.0" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">评价“能参与”“想继续”等 5 项。</text><line x1="88.0" y1="342" x2="498.66666666666674" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="88.0" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">结果</text><text x="88.0" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">觉得能参与，不等于想继续用；</text><text x="88.0" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">看重料理还是用餐氛围，</text><text x="88.0" y="470" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">评价差别很大（p=.0078）。</text><line x1="530.6666666666667" y1="320" x2="562.6666666666667" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="570.6666666666667" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="594.6666666666667" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">02</text><rect x="934.3333333333335" y="146" width="71" height="28" rx="14" fill="#eaf0fb"/><text x="969.8333333333335" y="165" font-size="14" fill="#2f64c8" font-weight="700" text-anchor="middle">进行中</text><text x="594.6666666666667" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">界面剧本比较</text><text x="594.6666666666667" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">30–40 名学生比较三种界面：只有对话记录 /</text><text x="594.6666666666667" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">显示 AI 的理解 / 理解可编辑 + 判断分担 +</text><text x="594.6666666666667" y="310" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">例文生成。</text><line x1="594.6666666666667" y1="342" x2="1005.3333333333335" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="594.6666666666667" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">要看什么</text><text x="594.6666666666667" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">看哪种界面更容易发现偏差、</text><text x="594.6666666666667" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">知道该怎么改。</text><line x1="1037.3333333333335" y1="320" x2="1069.3333333333335" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1077.3333333333335" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="1101.3333333333335" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">03</text><rect x="1441.0000000000002" y="146" width="71" height="28" rx="14" fill="#f0f1f3"/><text x="1476.5000000000002" y="165" font-size="14" fill="#8a9099" font-weight="700" text-anchor="middle">计划中</text><text x="1101.3333333333335" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">实际对话 + 眼动</text><text x="1101.3333333333335" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">6 轮真实对话，比较“只能看理解”和</text><text x="1101.3333333333335" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">“能改判断分担”两种界面；记录视线、</text><text x="1101.3333333333335" y="310" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">出声思考和修改操作。</text><line x1="1101.3333333333335" y1="342" x2="1512.0000000000002" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="1101.3333333333335" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">要看什么</text><text x="1101.3333333333335" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">看用户发现偏差后，会不会回看</text><text x="1101.3333333333335" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">理解面板，再改输入或判断分担。</text><text x="64" y="566" font-size="14.5" fill="#8a9099" font-weight="400" text-anchor="start">第 1 阶段中看重用餐氛围的一组只有 6 人；第 2 阶段是对画面剧本的印象评价，不是实际操作。</text></svg>