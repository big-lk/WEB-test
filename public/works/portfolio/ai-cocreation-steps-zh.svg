<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-label="引导用户说出独特判断：AI 共创界面的步骤结构" xml:lang="zh" style="font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f64c8"/></marker></defs><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><rect width="1600" height="950" fill="#fff"/><text x="64" y="74" font-size="34" fill="#1b1d21" font-weight="700" text-anchor="start">引导用户说出独特判断：AI 共创界面的步骤结构</text><text x="64" y="112" font-size="18" fill="#5f6670" font-weight="400" text-anchor="start">示例场景：为最近很累的对方准备一顿晚餐（一次 6 轮的对话）</text><circle cx="82" cy="166" r="18" fill="#b57900"/><text x="82" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="112" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">说出想法</text><text x="64" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">用自己的话说要什么，</text><text x="64" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">里面常有说不清的词。</text><rect x="64" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="414" y1="432.0" x2="436" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="458" cy="166" r="18" fill="#b57900"/><text x="458" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="488" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">看见 AI 的理解</text><text x="440" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">右侧面板把这句话拆成几个</text><text x="440" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">价值项目，写出推测和顺序。</text><rect x="440" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="790" y1="432.0" x2="812" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="834" cy="166" r="18" fill="#b57900"/><text x="834" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="864" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">发现偏差</text><text x="816" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">对照自己的想法，</text><text x="816" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">找出 AI 理解偏的地方。</text><rect x="816" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><line x1="1166" y1="432.0" x2="1188" y2="432.0" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="1210" cy="166" r="18" fill="#b57900"/><text x="1210" y="172" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1240" y="174" font-size="24" fill="#1b1d21" font-weight="700" text-anchor="start">修正</text><text x="1192" y="212" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">补一句话，或者改某个</text><text x="1192" y="236" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">项目由谁来判断。</text><rect x="1192" y="262" width="344" height="340" rx="16" fill="#f5f6f8" stroke="#f5f6f8" stroke-width="1.5" /><rect x="84" y="284" width="44" height="24" rx="12" fill="#eaf0fb"/><text x="106" y="301" font-size="13" fill="#2f64c8" font-weight="700" text-anchor="middle">你</text><rect x="84" y="320" width="304" height="108" rx="14" fill="#fff" stroke="#c9d6f0" stroke-width="1.5" /><text x="102" y="354" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">对方最近很累，胃口也不好。</text><text x="102" y="380" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">想做一顿有点特别、</text><text x="102" y="406" font-size="16" fill="#1b1d21" font-weight="400" text-anchor="start">又不用他费力配合的晚餐。</text><rect x="84" y="532" width="304" height="48" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="100" y="562" font-size="15" fill="#8a9099" font-weight="400" text-anchor="start">输入你的想法…</text><rect x="326" y="538" width="54" height="36" rx="8" fill="#2f64c8"/><path d="M353 564V548M347 554l6-6 6 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="296" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">AI 的理解</text><rect x="458" y="312" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="312" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="342" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">少做几道菜</text><rect x="684" y="325" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="342" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">优先 1</text><text x="476" y="372" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI 推测：准备和上桌都要省事</text><rect x="458" y="406" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="406" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="436" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">有点特别</text><rect x="684" y="419" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="436" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">优先 2</text><text x="476" y="466" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI 推测：摆盘要有纪念感</text><rect x="458" y="500" width="308" height="82" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="458" y="500" width="5" height="82" rx="2.5" fill="#2f64c8"/><text x="476" y="530" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">清淡温热</text><rect x="684" y="513" width="70" height="24" rx="12" fill="#eaf0fb"/><text x="719.0" y="530" font-size="12.5" fill="#2f64c8" font-weight="700" text-anchor="middle">优先 3</text><text x="476" y="560" font-size="14" fill="#5f6670" font-weight="400" text-anchor="start">AI 推测：照顾他的胃口</text><rect x="834" y="284" width="308" height="126" rx="10" fill="#fff" stroke="#d9622b" stroke-width="1.6" /><rect x="848" y="296" width="99" height="24" rx="12" fill="#fdf0e9"/><text x="860" y="313" font-size="13.5" fill="#d9622b" font-weight="700" text-anchor="start">意思被限定</text><text x="850" y="346" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">“特别”被理解成“摆盘有纪念</text><text x="850" y="370" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">感”，我想的是“做他爱吃的</text><text x="850" y="394" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">家常菜”。</text><rect x="834" y="426" width="308" height="102" rx="10" fill="#fff" stroke="#d9622b" stroke-width="1.6" /><rect x="848" y="438" width="129" height="24" rx="12" fill="#fdf0e9"/><text x="860" y="455" font-size="13.5" fill="#d9622b" font-weight="700" text-anchor="start">顺序被抢先决定</text><text x="850" y="488" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">AI 先保证“少做几道菜”，</text><text x="850" y="512" font-size="15" fill="#1b1d21" font-weight="400" text-anchor="start">我更在意“合他胃口”。</text><text x="1210" y="298" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">改输入</text><rect x="1210" y="310" width="308" height="84" rx="10" fill="#fff" stroke="#c9d6f0" stroke-width="1.5" /><text x="1226" y="342" font-size="14.5" fill="#1b1d21" font-weight="400" text-anchor="start">“特别”是指他爱吃的家常味；</text><text x="1226" y="366" font-size="14.5" fill="#1b1d21" font-weight="400" text-anchor="start">菜少一点没关系，但要合胃口。</text><text x="1210" y="418" font-size="14" fill="#5f6670" font-weight="700" text-anchor="start">改判断分担</text><rect x="1210" y="430" width="308" height="130" rx="10" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><rect x="1210" y="430" width="5" height="130" rx="2.5" fill="#2f64c8"/><text x="1228" y="462" font-size="17" fill="#1b1d21" font-weight="700" text-anchor="start">有点特别</text><rect x="1226" y="484" width="276" height="44" rx="10" fill="#eef0f3" stroke="#eef0f3" stroke-width="1.5" /><rect x="1230" y="488" width="84.0" height="36" rx="8" fill="#2f64c8"/><text x="1272.0" y="511" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">自己判断</text><text x="1364.0" y="511" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">和 AI 商量</text><text x="1456.0" y="511" font-size="13" fill="#5f6670" font-weight="500" text-anchor="middle">交给 AI</text><path d="M1364.0 610V660H612.0V618" fill="none" stroke="#2f64c8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ahb)"/><rect x="789.5" y="642" width="397" height="36" rx="18" fill="#fff" stroke="#2f64c8" stroke-width="1.5"/><text x="988.0" y="666" font-size="16" fill="#2f64c8" font-weight="700" text-anchor="middle">AI 按修正更新回答和理解面板，进入下一轮</text><rect x="64.0" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="86.0" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">价值项目</text><text x="86.0" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">用户在意的一件事，例如“合胃口”“少费力”。AI 把</text><text x="86.0" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">用户的话拆成这些项目，写出推测的意思和先后顺序。</text><rect x="565.3333333333333" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="587.3333333333333" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">两种偏差</text><text x="587.3333333333333" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">意思被限定：AI 把模糊的词收窄成大众的一种意思。</text><text x="587.3333333333333" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">顺序被抢先决定：AI 没问就排好了几件事的先后。</text><rect x="1066.6666666666665" y="730" width="469.3333333333333" height="150" rx="12" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="1088.6666666666665" y="770" font-size="19" fill="#1b1d21" font-weight="700" text-anchor="start">判断分担</text><text x="1088.6666666666665" y="806" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">每个项目由谁来定：自己判断、和 AI 商量、交给 AI。</text><text x="1088.6666666666665" y="832" font-size="15.5" fill="#5f6670" font-weight="400" text-anchor="start">用户随时可以改，AI 按选择调整回答方式。</text><text x="64" y="920" font-size="14.5" fill="#8a9099" font-weight="400" text-anchor="start">示例对话为说明用的设想场景，不是实验数据；界面结构依据硕士研究的眼动实验用测试界面整理。</text></svg>