<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" style="font-family:'Noto Sans SC','Noto Sans JP','Hiragino Sans','PingFang SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1120" height="360" fill="#fff"/><rect x="40.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="56.0" y="54" font-size="17" font-weight="700" fill="#171717">企业实验室</text><text x="56.0" y="82" font-size="14" fill="#404040">大量烤制，记录每个时间、温</text><text x="56.0" y="102" font-size="14" fill="#404040">度下的形状和颜色</text><path d="M282.0 88 H300.0" stroke="#b57900" stroke-width="2.5"/><path d="M298.0 81 L308.0 88 L298.0 95 Z" fill="#b57900"/><rect x="308.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="324.0" y="54" font-size="17" font-weight="700" fill="#171717">学习变化</text><text x="324.0" y="82" font-size="14" fill="#404040">模型学到食材怎样随时间、温</text><text x="324.0" y="102" font-size="14" fill="#404040">度变化</text><path d="M550.0 88 H568.0" stroke="#b57900" stroke-width="2.5"/><path d="M566.0 81 L576.0 88 L566.0 95 Z" fill="#b57900"/><rect x="576.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="592.0" y="54" font-size="17" font-weight="700" fill="#171717">图像时间轴</text><text x="592.0" y="82" font-size="14" fill="#404040">生成一条连续变化的预想图</text><path d="M818.0 88 H836.0" stroke="#b57900" stroke-width="2.5"/><path d="M834.0 81 L844.0 88 L834.0 95 Z" fill="#b57900"/><rect x="844.0" y="24" width="236" height="128" rx="10" fill="#171717" stroke="#f7b718" stroke-width="2"/><text x="860.0" y="54" font-size="17" font-weight="700" fill="#f7b718">用户设定</text><text x="860.0" y="82" font-size="14" fill="#e5e5e5">调时间、温度、干燥度，就是</text><text x="860.0" y="102" font-size="14" fill="#e5e5e5">在轴上取一帧</text><rect x="43.0" y="186" width="142.57142857142858" height="56" rx="6" fill="#f3e7cf"/><rect x="191.57142857142858" y="186" width="142.57142857142858" height="56" rx="6" fill="#efd3a1"/><rect x="340.14285714285717" y="186" width="142.57142857142858" height="56" rx="6" fill="#e7b56c"/><rect x="488.7142857142858" y="186" width="142.57142857142858" height="56" rx="6" fill="#d79443"/><rect x="637.2857142857143" y="186" width="142.57142857142858" height="56" rx="6" fill="#b8702a"/><rect x="785.8571428571429" y="186" width="142.57142857142858" height="56" rx="6" fill="#8f5121"/><rect x="934.4285714285716" y="186" width="142.57142857142858" height="56" rx="6" fill="#6b3a18"/><rect x="634.2857142857143" y="181" width="148.57142857142858" height="66" rx="8" fill="none" stroke="#171717" stroke-width="3"/><path d="M40 266 H1076" stroke="#171717" stroke-width="2"/><path d="M1072 259 L1084 266 L1072 273 Z" fill="#171717"/><text x="1080" y="290" font-size="14" text-anchor="end" fill="#525252">时间</text><text x="40" y="290" font-size="14" fill="#525252">0</text><text x="40" y="322" font-size="14" fill="#404040">适合企业为单款产品做：数据和模型随产品出厂。出厂后模型难以迭代，但烤箱本身多年不换，影响有限。</text></svg>