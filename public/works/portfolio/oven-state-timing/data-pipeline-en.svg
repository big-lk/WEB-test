<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" style="font-family:'Noto Sans SC','Noto Sans JP','Hiragino Sans','PingFang SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1120" height="360" fill="#fff"/><rect x="40.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="56.0" y="54" font-size="17" font-weight="700" fill="#171717">Company lab</text><text x="56.0" y="82" font-size="14" fill="#404040">Bake at scale and record</text><text x="56.0" y="102" font-size="14" fill="#404040">shape and color at each</text><text x="56.0" y="122" font-size="14" fill="#404040">time and temperature</text><path d="M282.0 88 H300.0" stroke="#b57900" stroke-width="2.5"/><path d="M298.0 81 L308.0 88 L298.0 95 Z" fill="#b57900"/><rect x="308.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="324.0" y="54" font-size="17" font-weight="700" fill="#171717">Learn the change</text><text x="324.0" y="82" font-size="14" fill="#404040">The model learns how food</text><text x="324.0" y="102" font-size="14" fill="#404040">changes with time and heat</text><path d="M550.0 88 H568.0" stroke="#b57900" stroke-width="2.5"/><path d="M566.0 81 L576.0 88 L566.0 95 Z" fill="#b57900"/><rect x="576.0" y="24" width="236" height="128" rx="10" fill="#fff4d6" stroke="#f7b718" stroke-width="2"/><text x="592.0" y="54" font-size="17" font-weight="700" fill="#171717">Image timeline</text><text x="592.0" y="82" font-size="14" fill="#404040">Generate one continuously</text><text x="592.0" y="102" font-size="14" fill="#404040">changing predicted image</text><path d="M818.0 88 H836.0" stroke="#b57900" stroke-width="2.5"/><path d="M834.0 81 L844.0 88 L834.0 95 Z" fill="#b57900"/><rect x="844.0" y="24" width="236" height="128" rx="10" fill="#171717" stroke="#f7b718" stroke-width="2"/><text x="860.0" y="54" font-size="17" font-weight="700" fill="#f7b718">User setting</text><text x="860.0" y="82" font-size="14" fill="#e5e5e5">Adjusting time, heat or</text><text x="860.0" y="102" font-size="14" fill="#e5e5e5">dryness picks a frame on</text><text x="860.0" y="122" font-size="14" fill="#e5e5e5">the timeline</text><rect x="43.0" y="186" width="142.57142857142858" height="56" rx="6" fill="#f3e7cf"/><rect x="191.57142857142858" y="186" width="142.57142857142858" height="56" rx="6" fill="#efd3a1"/><rect x="340.14285714285717" y="186" width="142.57142857142858" height="56" rx="6" fill="#e7b56c"/><rect x="488.7142857142858" y="186" width="142.57142857142858" height="56" rx="6" fill="#d79443"/><rect x="637.2857142857143" y="186" width="142.57142857142858" height="56" rx="6" fill="#b8702a"/><rect x="785.8571428571429" y="186" width="142.57142857142858" height="56" rx="6" fill="#8f5121"/><rect x="934.4285714285716" y="186" width="142.57142857142858" height="56" rx="6" fill="#6b3a18"/><rect x="634.2857142857143" y="181" width="148.57142857142858" height="66" rx="8" fill="none" stroke="#171717" stroke-width="3"/><path d="M40 266 H1076" stroke="#171717" stroke-width="2"/><path d="M1072 259 L1084 266 L1072 273 Z" fill="#171717"/><text x="1080" y="290" font-size="14" text-anchor="end" fill="#525252">time</text><text x="40" y="290" font-size="14" fill="#525252">0</text><text x="40" y="322" font-size="14" fill="#404040">Fits a company building one product: data and model ship with the oven. The model is hard to update after release, but</text><text x="40" y="342" font-size="14" fill="#404040">ovens stay in use for years, so the cost is limited.</text></svg>