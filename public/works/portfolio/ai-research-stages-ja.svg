<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="研究は三段階：課題を見つけ、画面を比べ、実際の対話を見る" xml:lang="ja" style="font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><rect width="1600" height="600" fill="#fff"/><text x="64" y="74" font-size="30" fill="#1b1d21" font-weight="700" text-anchor="start">研究は三段階：課題を見つけ、画面を比べ、実際の対話を見る</text><rect x="64.0" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="88.0" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">01</text><rect x="442.66666666666674" y="146" width="56" height="28" rx="14" fill="#e7f5ee"/><text x="470.66666666666674" y="165" font-size="14" fill="#1f8a5b" font-weight="700" text-anchor="middle">完了</text><text x="88.0" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">対話条件の場面比較調査</text><text x="88.0" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">47名が同じ夕食構想について4種類のAI</text><text x="88.0" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">対話を読み、関与可能感・継続意向など</text><text x="88.0" y="310" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">5項目を評価。</text><line x1="88.0" y1="342" x2="498.66666666666674" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="88.0" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">結果</text><text x="88.0" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">関与できると感じても続けたいとは</text><text x="88.0" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">限らず、何を重視するかで評価が</text><text x="88.0" y="470" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">大きく異なった（p=.0078）。</text><line x1="530.6666666666667" y1="320" x2="562.6666666666667" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="570.6666666666667" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="594.6666666666667" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">02</text><rect x="934.3333333333335" y="146" width="71" height="28" rx="14" fill="#eaf0fb"/><text x="969.8333333333335" y="165" font-size="14" fill="#2f64c8" font-weight="700" text-anchor="middle">実施中</text><text x="594.6666666666667" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">UIシナリオ比較調査</text><text x="594.6666666666667" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">学生30〜40名が三つの画面を比較：対話</text><text x="594.6666666666667" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">履歴のみ／AIの解釈表示／解釈編集＋</text><text x="594.6666666666667" y="310" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">判断分担＋例文生成。</text><line x1="594.6666666666667" y1="342" x2="1005.3333333333335" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="594.6666666666667" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">見ること</text><text x="594.6666666666667" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">どの画面がずれに気づきやすく、</text><text x="594.6666666666667" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">直し方が分かりやすいか。</text><line x1="1037.3333333333335" y1="320" x2="1069.3333333333335" y2="320" stroke="#8a9099" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1077.3333333333335" y="120" width="458.6666666666667" height="400" rx="14" fill="#fff" stroke="#dfe2e7" stroke-width="1.5" /><text x="1101.3333333333335" y="166" font-size="15" fill="#b57900" font-weight="700" text-anchor="start">03</text><rect x="1441.0000000000002" y="146" width="71" height="28" rx="14" fill="#f0f1f3"/><text x="1476.5000000000002" y="165" font-size="14" fill="#8a9099" font-weight="700" text-anchor="middle">計画中</text><text x="1101.3333333333335" y="212" font-size="23" fill="#1b1d21" font-weight="700" text-anchor="start">実対話＋視線計測</text><text x="1101.3333333333335" y="256" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">6ターンの実対話で「解釈を見るだけ」と</text><text x="1101.3333333333335" y="283" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">「判断分担を変えられる」画面を比較。</text><text x="1101.3333333333335" y="310" font-size="16" fill="#5f6670" font-weight="400" text-anchor="start">視線・発話・修正操作を記録。</text><line x1="1101.3333333333335" y1="342" x2="1512.0000000000002" y2="342" stroke="#dfe2e7" stroke-width="1.5"/><text x="1101.3333333333335" y="378" font-size="14" fill="#b57900" font-weight="700" text-anchor="start">見ること</text><text x="1101.3333333333335" y="414" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">ずれに気づいた後、パネルを見返し</text><text x="1101.3333333333335" y="442" font-size="17" fill="#1b1d21" font-weight="500" text-anchor="start">入力文や判断分担を直すか。</text><text x="64" y="566" font-size="14.5" fill="#8a9099" font-weight="400" text-anchor="start">第1段階で食事場面を重視する群は6名のみ。第2段階は画面シナリオへの印象評価で、実際の操作ではない。</text></svg>