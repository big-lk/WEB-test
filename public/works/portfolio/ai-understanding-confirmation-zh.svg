<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">先看见 AI 如何理解，再继续设计</title>
  <desc id="desc">交互概念示意：用户希望设计一个有高级感的家居相框。AI 旁侧显示简洁比例、精致材质和克制装饰的常规理解，提供符合我的意思及补充我的理解两个入口。用户补充温润、耐用和融入日常的细节后，AI 调整材质、边角和比例，并解释取舍。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#929292"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Microsoft YaHei', 'Yu Gothic', sans-serif">
    <text x="64" y="73" font-size="40" font-weight="700" fill="#0a0a0a" >先看见 AI 如何理解，再继续设计</text>
    <text x="64" y="114" font-size="20" font-weight="400" fill="#656565" >家居相框场景：把“高级感”转成可确认、可补充的设计依据。</text>
    <rect x="1244" y="34" width="292" height="48" rx="24" fill="#f7b718"/>
    <text x="1390" y="64" font-size="19" font-weight="650" fill="#0a0a0a" text-anchor="middle">交互概念示意</text>
    <path d="M 64 139 H 1536" stroke="#dddddd"/>

    <rect x="64" y="164" width="446" height="292" rx="18" fill="#f4f4f4" stroke="#dddddd"/>
    <rect x="64" y="188" width="5" height="40" rx="2.5" fill="#f7b718"/>
    <text x="100" y="214" font-size="18" font-weight="650" fill="#656565" >用户输入</text>
    <text x="100" y="272" font-size="31" font-weight="550" fill="#0a0a0a" >我想设计一个有</text>
    <text x="100" y="315" font-size="31" font-weight="550" fill="#0a0a0a" >“高级感”的家居相框。</text>
    <path d="M 516 310 H 539" stroke="#929292" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="548" y="164" width="988" height="292" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="584" y="214" font-size="26" font-weight="650" fill="#0a0a0a" >AI 的常规理解</text>
    <text x="1500" y="214" font-size="18" font-weight="400" fill="#656565" text-anchor="end">请确认这是否符合你的意思</text>
    <circle cx="591" cy="255" r="5" fill="#f7b718"/>
    <text x="584" y="289" font-size="25" font-weight="650" fill="#0a0a0a" >简洁比例</text>
    <text x="584" y="320" font-size="18" font-weight="400" fill="#656565" >清楚的结构</text>
    <text x="584" y="346" font-size="18" font-weight="400" fill="#656565" >干净的轮廓</text>
    <circle cx="898" cy="255" r="5" fill="#f7b718"/>
    <text x="891" y="289" font-size="25" font-weight="650" fill="#0a0a0a" >精致材质</text>
    <text x="891" y="320" font-size="18" font-weight="400" fill="#656565" >重视材质质感</text>
    <text x="891" y="346" font-size="18" font-weight="400" fill="#656565" >与细部完成度</text>
    <circle cx="1205" cy="255" r="5" fill="#f7b718"/>
    <text x="1198" y="289" font-size="25" font-weight="650" fill="#0a0a0a" >克制装饰</text>
    <text x="1198" y="320" font-size="18" font-weight="400" fill="#656565" >减少额外装饰</text>
    <text x="1198" y="346" font-size="18" font-weight="400" fill="#656565" >保留必要细节</text>
    <rect x="584" y="370" width="412" height="58" rx="10" fill="#0a0a0a"/>
    <text x="790" y="406" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">符合我的意思</text>
    <rect x="1016" y="370" width="484" height="58" rx="10" fill="#f7b718"/>
    <text x="1258" y="406" font-size="22" font-weight="600" fill="#0a0a0a" text-anchor="middle">补充我的理解</text>
    <path d="M 1258 456 V 479 H 287 V 499" fill="none" stroke="#929292" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

    <rect x="64" y="508" width="446" height="302" rx="18" fill="#fffaf0" stroke="#e7d5ab"/>
    <rect x="64" y="531" width="5" height="40" rx="2.5" fill="#f7b718"/>
    <text x="100" y="558" font-size="21" font-weight="650" fill="#0a0a0a" >用户补充</text>
    <text x="100" y="625" font-size="28" font-weight="500" fill="#0a0a0a" >对我更重要的是：</text>
    <text x="100" y="668" font-size="28" font-weight="500" fill="#0a0a0a" >温润、耐用，</text>
    <text x="100" y="711" font-size="28" font-weight="500" fill="#0a0a0a" >以及能融入日常的细节。</text>
    <path d="M 516 661 H 539" stroke="#929292" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="548" y="508" width="988" height="302" rx="18" fill="#ffffff" stroke="#dddddd"/>
    <text x="584" y="554" font-size="26" font-weight="650" fill="#0a0a0a" >AI 根据补充调整方案</text>
    <g aria-hidden="true">
      <rect x="584" y="582" width="264" height="170" rx="24" fill="#d1d1d1" stroke="#a6a6a6" stroke-width="1.5"/>
      <rect x="604" y="602" width="224" height="130" rx="9" fill="#fafafa" stroke="#b6b6b6"/>
      <circle cx="754" cy="641" r="17" fill="#dcdcdc"/>
      <path d="M 615 721 L 673 656 L 718 697 L 744 674 L 817 721 Z" fill="#b8b8b8"/>
      <path d="M 615 721 L 681 695 L 725 715 L 763 690 L 817 721 Z" fill="#909090"/>
    </g>
    <text x="716" y="776" font-size="17" font-weight="400" fill="#656565" text-anchor="middle">调整后的相框示意</text>
    <text x="884" y="591" font-size="21" font-weight="650" fill="#0a0a0a" >材质</text>
    <text x="884" y="618" font-size="19" font-weight="400" fill="#555555" >优先温润触感，兼顾耐用。</text>
    <text x="884" y="651" font-size="21" font-weight="650" fill="#0a0a0a" >边角</text>
    <text x="884" y="678" font-size="19" font-weight="400" fill="#555555" >柔和处理，适合日常接触。</text>
    <text x="884" y="711" font-size="21" font-weight="650" fill="#0a0a0a" >比例</text>
    <text x="884" y="738" font-size="19" font-weight="400" fill="#555555" >保持简洁结构，让细节融入家居。</text>
    <path d="M 884 751 H 1500" stroke="#e4e4e4"/>
    <text x="884" y="781" font-size="18" font-weight="400" fill="#555555" >取舍：减少装饰，以触感、耐用性和日常融合为优先。</text>

    <path d="M 208 887 H 1363" stroke="#dedede" stroke-width="3"/>
    <circle cx="208" cy="887" r="25" fill="#0a0a0a"/>
    <text x="208" y="894" font-size="21" font-weight="650" fill="#ffffff" text-anchor="middle">1</text>
    <text x="208" y="938" font-size="21" font-weight="500" fill="#0a0a0a" text-anchor="middle">模糊输入</text>
    <circle cx="593" cy="887" r="25" fill="#f7b718"/>
    <text x="593" y="894" font-size="21" font-weight="650" fill="#0a0a0a" text-anchor="middle">2</text>
    <text x="593" y="938" font-size="21" font-weight="500" fill="#0a0a0a" text-anchor="middle">显式展示理解</text>
    <circle cx="978" cy="887" r="25" fill="#f7b718"/>
    <text x="978" y="894" font-size="21" font-weight="650" fill="#0a0a0a" text-anchor="middle">3</text>
    <text x="978" y="938" font-size="21" font-weight="500" fill="#0a0a0a" text-anchor="middle">确认或补充</text>
    <circle cx="1363" cy="887" r="25" fill="#f7b718"/>
    <text x="1363" y="894" font-size="21" font-weight="650" fill="#0a0a0a" text-anchor="middle">4</text>
    <text x="1363" y="938" font-size="21" font-weight="500" fill="#0a0a0a" text-anchor="middle">调整并解释取舍</text>
  </g>
</svg>

