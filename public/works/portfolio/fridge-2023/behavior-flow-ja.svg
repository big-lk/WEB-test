<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1600" height="700" fill="#fffaf0"/>
<text x="60" y="62" font-size="30" font-weight="700" fill="#141414">冷蔵庫の食材管理 · 行動フロー（卒業制作をもとに再構成）</text>
