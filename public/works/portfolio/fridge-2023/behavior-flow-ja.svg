<text x="1362" y="250" font-size="14" fill="#555">リストと日付を自動更</text>
<text x="1362" y="269" font-size="14" fill="#555">新</text>
<text x="60" y="404" font-size="18" font-weight="700" fill="#b57900">取り出す</text>
<rect x="60" y="420" width="166" height="156" rx="12" fill="#ffffff" stroke="#f7b718" stroke-width="2" />
<circle cx="86" cy="448" r="15" fill="#f7b718"/><text x="86" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">1</text>
<text x="74" y="492" font-size="19" font-weight="700" fill="#141414">使いたい食材</text>
<text x="74" y="520" font-size="14" fill="#555">スマホか庫内画面で確</text>
<text x="74" y="539" font-size="14" fill="#555">認</text>
<path d="M229 498.0 L241 498.0" stroke="#b57900" stroke-width="2"/><path d="M235 493.0 L242 498.0 L235 503.0" fill="none" stroke="#b57900" stroke-width="2"/>
<rect x="244" y="420" width="166" height="156" rx="12" fill="#ffffff" stroke="#f7b718" stroke-width="2" />
<circle cx="270" cy="448" r="15" fill="#f7b718"/><text x="270" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">2</text>
<text x="258" y="492" font-size="19" font-weight="700" fill="#141414">ドアのライト</text>
<text x="258" y="520" font-size="14" fill="#555">どのドア・どの段かを</text>
<text x="258" y="539" font-size="14" fill="#555">示す</text>
<path d="M413 498.0 L425 498.0" stroke="#b57900" stroke-width="2"/><path d="M419 493.0 L426 498.0 L419 503.0" fill="none" stroke="#b57900" stroke-width="2"/>
<rect x="428" y="420" width="166" height="156" rx="12" fill="#ffffff" stroke="#f7b718" stroke-width="2" />
<circle cx="454" cy="448" r="15" fill="#f7b718"/><text x="454" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">3</text>
<text x="442" y="492" font-size="19" font-weight="700" fill="#141414">庫内ライト</text>
<text x="442" y="520" font-size="14" fill="#555">位置が点灯しすぐ取れ</text>
<text x="442" y="539" font-size="14" fill="#555">る</text>
<path d="M597 498.0 L609 498.0" stroke="#b57900" stroke-width="2"/><path d="M603 493.0 L610 498.0 L603 503.0" fill="none" stroke="#b57900" stroke-width="2"/>
<rect x="612" y="420" width="166" height="156" rx="12" fill="#ffffff" stroke="#f7b718" stroke-width="2" />
