<text x="442" y="222" font-size="19" font-weight="700" fill="#141414">スキャナーを外</text>
<text x="442" y="246" font-size="19" font-weight="700" fill="#141414">す</text>
<text x="442" y="274" font-size="14" fill="#555">ドアから外して台に置</text>
<text x="442" y="293" font-size="14" fill="#555">く</text>
